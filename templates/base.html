{% load static %}
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FC経営管理{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/app.css' %}">
</head>
<body>
  {% if user.is_authenticated %}
  <header>
    <a class="brand" href="{% url 'dashboard' %}">FC経営管理</a>
    <nav>
      <a href="{% url 'dashboard' %}">ダッシュボード</a>
      <a href="{% url 'store_pnl' %}">店舗別収支</a>
      <a href="{% url 'facilities' %}">施設</a>
      <a href="{% url 'groups' %}">所属拠点</a>
      <a href="{% url 'employees' %}">従業員</a>
      <a href="{% url 'imports' %}">CSV取込</a>
      <a href="{% url 'users' %}">ユーザー</a>
    </nav>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link-button">ログアウト</button></form>
  </header>
  {% endif %}
  <main class="{% if not user.is_authenticated %}auth-main{% endif %}">
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block breadcrumbs %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
